; Yummiii production PHP settings (on top of php.ini-production)
expose_php = Off
memory_limit = 256M
; Product photos: Laravel allows 5 MB; PHP lets up to 10 MB through so bigger
; photos get a friendly message instead of silently disappearing
upload_max_filesize = 10M
post_max_size = 12M
; The code never changes inside the image, so opcache never needs to re-check files
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

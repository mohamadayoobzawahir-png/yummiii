# Yummiii LIVE setup (the server). Your computer keeps using compose.yaml.
# Start / update:   ./deploy.sh
# All settings come from .env.prod (copy .env.prod.example and fill it in).
name: yummiii-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: yummiii-app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"    # HTTP/3
    environment:
      APP_NAME: Yummiii
      APP_ENV: production
      APP_DEBUG: "false"                # never show error details to visitors
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.prod}
      APP_URL: ${APP_URL:?Set APP_URL in .env.prod}
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.prod}
      LOG_CHANNEL: daily
      LOG_DAILY_DAYS: 14
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: yummiii
      DB_USERNAME: yummiii
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      SANCTUM_TOKEN_EXPIRATION: ${SANCTUM_TOKEN_EXPIRATION:-10080}
    volumes:
      - storage:/app/storage            # product photos + logs survive updates
      - caddy_data:/data                # HTTPS certificates
      - caddy_config:/config
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # No "ports": the database can't be reached from the internet, only by the app
    environment:
      MYSQL_DATABASE: yummiii
      MYSQL_USER: yummiii
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.prod}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10m

volumes:
  storage:
  caddy_data:
  caddy_config:
  mysql_data:
